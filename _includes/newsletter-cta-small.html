<div class="newsletter-cta">
  <div class="newsletter-cta-content">
    <form
      action="https://buttondown.email/api/emails/embed-subscribe/miguelalonsojr"
      method="post"
      class="embeddable-buttondown-form"
      id="newsletter-form-small"
    >
      <div class="form-group">
        <input
          type="email"
          name="email"
          id="bd-email-small"
          placeholder="Subscribe to the newsletter with your email..."
          required
          aria-label="Email address"
        />
        <input type="submit" value="Subscribe" />
      </div>
      <div id="newsletter-message-small" class="newsletter-message" style="display:none;"></div>
    </form>
  </div>
</div>

<script>
(function() {
  const form = document.getElementById('newsletter-form-small');
  if (!form) return;

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const email = form.querySelector('input[type="email"]').value;
    const submitBtn = form.querySelector('input[type="submit"]');
    const messageDiv = document.getElementById('newsletter-message-small');

    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.value = 'Subscribing...';

    // Submit via fetch
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: {
        'Accept': 'application/json',
      }
    })
    .then(response => {
      if (response.ok) {
        messageDiv.textContent = '✓ Thanks for subscribing! Check your email to confirm.';
        messageDiv.style.color = '#28a745';
        messageDiv.style.display = 'block';
        form.querySelector('input[type="email"]').value = '';
      } else {
        throw new Error('Subscription failed');
      }
    })
    .catch(error => {
      messageDiv.textContent = '✗ Something went wrong. Please try again.';
      messageDiv.style.color = '#dc3545';
      messageDiv.style.display = 'block';
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.value = 'Subscribe';
    });
  });
})();
</script>
